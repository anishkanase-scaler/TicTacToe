spring.application.name=tictactoe

# In-memory H2 database, so the app runs with zero setup.
spring.datasource.url=jdbc:h2:mem:tictactoe
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# To use Postgres instead, comment out the H2 lines above and use these:
# spring.datasource.url=jdbc:postgresql://localhost:5432/tictactoe
# spring.datasource.username=postgres
# spring.datasource.password=postgres
